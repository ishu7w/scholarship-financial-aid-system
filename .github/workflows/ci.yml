name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — the latest push is the one
# whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets are configured for this job, and that is deliberate: the
    # app must build and run in demo mode with zero env vars. If a change
    # makes a hosted service mandatory, this job is where it fails.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and package Java backend
        run: npm run build:java

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build

      - name: Verify Java and frontend together
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/scholarai-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000/login > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/scholarai-server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/scholarai-server.log"
            exit 1
          fi
          npm run test:smoke || { cat "$RUNNER_TEMP/scholarai-server.log"; exit 1; }
